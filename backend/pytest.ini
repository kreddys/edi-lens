[pytest]
# Look for tests in the 'tests' directory
testpaths = tests

# Tell pytest about our source folder for better imports
pythonpath = .

# Use asyncio mode for all tests, required for FastAPI/SQLAlchemy
asyncio_mode = strict

# Register custom markers to avoid warnings
markers =
    unit: Pure unit tests with no external dependencies (no DB, no network).
    integration: Tests requiring external services (DB, Keycloak), run in Docker.

# addopts provides command-line options to apply to every run.
# --tb=short will produce a much shorter, more readable traceback.
addopts = --tb=short

# filterwarnings ignores specified warnings so they don't clutter the output.
# We are ignoring DeprecationWarnings and UserWarnings which often come from libraries
# like pydantic, llama_index, and langchain.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning