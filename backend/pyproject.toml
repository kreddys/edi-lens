[tool.poetry]
name = "edi-lens-backend"
version = "0.1.0"
description = "Backend for EDI Lens Validator"
authors = ["Kishore Reddy <kishore5214@outlook.com>"]
readme = "README.md"
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11, <=3.13"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.31"}
asyncpg = "^0.29.0"
pydantic = "^2.8.2"
pydantic-settings = "^2.3.4"
alembic = "^1.13.2"
python-keycloak = "^4.0.0" 

# --- Dependencies for Keycloak JWT Validation ---
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
httpx = "^0.27.0"
pathspec = "^0.12.1"

# --- Dependencies for AI Agent Crew ---
# CrewAI now handles all LLM provider logic internally via LiteLLM
crewai = "^0.141.0"
crewai-tools = "^0.51.1"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.23.7"
httpx = "^0.27.0"
pytest-mock = "^3.12.0"
black = "^24.4.2"
ruff = "^0.4.2"
pre-commit = "^3.7.0"
pyyaml = "^6.0.1"