# FILE: backend/pyproject.toml
[tool.poetry]
name = "edi-lens-backend"
version = "0.1.0"
description = "Backend for EDI Lens Validator"
authors = ["Kishore Reddy <kishore5214@outlook.com>"]
readme = "README.md"
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11, <=3.13"
alembic = "^1.13.2"
asyncpg = "^0.29.0"
fastapi = "^0.111.0"
httpx = "^0.27.0"
jsonpatch = "^1.33.0"
openlit = "^1.34.24"
pathspec = "^0.12.1"
pydantic = "^2.8.2"
pydantic-settings = "^2.3.4"
python-dotenv = "^1.0.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-keycloak = "^4.0.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.31"}
uvicorn = {extras = ["standard"], version = "^0.30.1"}

# --- AI & RAG Dependencies (Final Compatible Set) ---
crewai = "^0.141.0"
# This library brings in sub-dependencies that require pypdf>=5.0.0
crewai-tools = "^0.51.1" 
llama-index-core = "0.10.60" 
# We explicitly require pypdf here to ensure our direct usage works,
# but we align our version with crewai-tools' requirement.
pypdf = ">=4.2.0"
pinecone-client = "^4.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.23.7"
httpx = "^0.27.0"
pytest-mock = "^3.12.0"
black = "^24.4.2"
ruff = "^0.4.2"
pre-commit = "^3.7.0"
pyyaml = "^6.0.1"