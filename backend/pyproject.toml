[tool.poetry]
name = "edi-lens-backend"
version = "0.1.0"
description = "Simplified NiFi workflow backend"
authors = ["EDI Lens Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
aiohttp = "^3.9.0"
httpx = "^0.25.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.12.0"
pydantic = "^2.4.0"
pydantic-settings = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.25.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
black = "^24.8.0"
isort = "^5.13.2"
pre-commit = "^3.8.0"
pytest-watch = "^4.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
markers = [
    "unit: fast-running isolated tests",
    "integration: tests that hit live NiFi/Registry instances",
    "e2e: end-to-end tests",
]
