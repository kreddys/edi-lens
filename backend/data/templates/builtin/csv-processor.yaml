# CSV Data Processor Template
# Process and transform CSV data with filtering and conversion capabilities

metadata:
  template_id: "global-csv-processor-v1.0"
  name: "CSV Data Processor"
  description: "Process and transform CSV data with filtering and conversion capabilities"
  category: "TRANSFORMATION"
  scope: "GLOBAL"
  tenant_id: null
  maintainer: "edi-lens-platform"
  based_on: null
  version: "1.0"
  deployment_method: "registry"
  tags:
    - "csv"
    - "data_processing"
    - "analytics"
    - "filtering"
    - "transformation"
  features:
    - "csv-parsing"
    - "data-filtering"
    - "format-conversion"
    - "header-detection"
    - "delimiter-handling"
  is_featured: true
  status: "ACTIVE"

# NiFi Flow Definition
flow_definition:
  processors:
    - id: "listen-http-processor"
      type: "ListenHTTP"
      name: "CSV Input Endpoint"
      position:
        x: 100
        y: 100
      properties:
        Listening Port: "${HTTP_LISTENING_PORT}"
        Base Path: "${HTTP_BASE_PATH}"
        Max Data Size: "${MAX_PAYLOAD_SIZE}"

    - id: "detect-delimiter-processor"
      type: "UpdateAttribute"
      name: "Set CSV Configuration"
      position:
        x: 350
        y: 100
      properties:
        csv.delimiter: "${DELIMITER}"
        csv.has_headers: "${HAS_HEADERS}"
        csv.output_format: "${OUTPUT_FORMAT}"

    - id: "parse-csv-processor"
      type: "ConvertRecord"
      name: "Parse CSV Data"
      position:
        x: 600
        y: 100
      properties:
        Record Reader: "CSVReader"
        Record Writer: "JsonRecordSetWriter"
        CSV Reader Delimiter: "${csv.delimiter}"
        CSV Reader Header Line: "${csv.has_headers}"

    - id: "filter-data-processor"
      type: "QueryRecord"
      name: "Apply Data Filters"
      position:
        x: 850
        y: 100
      properties:
        Record Reader: "JsonTreeReader"
        Record Writer: "JsonRecordSetWriter"
        SQL Query: |
          SELECT * FROM FLOWFILE 
          WHERE (
            '${FILTER_COLUMN}' = '' OR 
            CAST(${FILTER_COLUMN} AS VARCHAR) LIKE '%${FILTER_VALUE}%'
          )
      condition: "${FILTER_COLUMN:notEmpty()}"

    - id: "route-output-format-processor"
      type: "RouteOnAttribute"
      name: "Route by Output Format"
      position:
        x: 1100
        y: 100
      properties:
        Routing Strategy: "Route to Property name"
      dynamic_properties:
        json: "${OUTPUT_FORMAT:equals('json')}"
        xml: "${OUTPUT_FORMAT:equals('xml')}"
        excel: "${OUTPUT_FORMAT:equals('excel')}"
        parquet: "${OUTPUT_FORMAT:equals('parquet')}"

    - id: "convert-to-json-processor"
      type: "ConvertRecord"
      name: "Convert to JSON"
      position:
        x: 1350
        y: 50
      properties:
        Record Reader: "JsonTreeReader"
        Record Writer: "JsonRecordSetWriter"
        Pretty Print JSON: "true"

    - id: "convert-to-xml-processor"
      type: "ConvertRecord"
      name: "Convert to XML"
      position:
        x: 1350
        y: 100
      properties:
        Record Reader: "JsonTreeReader"
        Record Writer: "XMLRecordSetWriter"
        Schema Access Strategy: "Infer Schema"

    - id: "generate-preview-processor"
      type: "ExecuteScript"
      name: "Generate Data Preview"
      position:
        x: 1600
        y: 100
      properties:
        Script Engine: "python"
        Script Body: |
          import json
          flowFile = session.get()
          if flowFile is not None:
              content = session.read(flowFile).decode('utf-8')
              try:
                  if content.strip().startswith('['):
                      data = json.loads(content)
                      preview = data[:10] if len(data) > 10 else data
                      summary = {
                          "total_records": len(data),
                          "preview_records": len(preview),
                          "columns": list(data[0].keys()) if data else [],
                          "sample_data": preview
                      }
                  else:
                      summary = {"message": "Non-JSON output format"}
                  
                  flowFile = session.putAttribute(flowFile, 'processing.summary', json.dumps(summary))
              except Exception as e:
                  flowFile = session.putAttribute(flowFile, 'processing.error', str(e))
              session.transfer(flowFile, REL_SUCCESS)

  connections:
    - identifier: "listen-to-config-connection"
      source:
        id: "listen-http-processor"
        type: "PROCESSOR"
      destination:
        id: "detect-delimiter-processor"
        type: "PROCESSOR"
      selectedRelationships: ["success"]

    - identifier: "config-to-parse-connection"
      source:
        id: "detect-delimiter-processor"
        type: "PROCESSOR"
      destination:
        id: "parse-csv-processor"
        type: "PROCESSOR"
      selectedRelationships: ["success"]

    - identifier: "parse-to-filter-connection"
      source:
        id: "parse-csv-processor"
        type: "PROCESSOR"
      destination:
        id: "filter-data-processor"
        type: "PROCESSOR"
      selectedRelationships: ["success"]

    - identifier: "filter-to-route-connection"
      source:
        id: "filter-data-processor"
        type: "PROCESSOR"
      destination:
        id: "route-output-format-processor"
        type: "PROCESSOR"
      selectedRelationships: ["success"]

    - identifier: "route-to-json-connection"
      source:
        id: "route-output-format-processor"
        type: "PROCESSOR"
      destination:
        id: "convert-to-json-processor"
        type: "PROCESSOR"
      selectedRelationships: ["json"]

    - identifier: "json-to-preview-connection"
      source:
        id: "convert-to-json-processor"
        type: "PROCESSOR"
      destination:
        id: "generate-preview-processor"
        type: "PROCESSOR"
      selectedRelationships: ["success"]

# Configuration Schema
configuration_schema:
  type: "object"
  required:
    - "endpoint_config"
    - "csv_options"
  properties:
    endpoint_config:
      type: "object"
      title: "HTTP Endpoint Configuration"
      required: ["listening_port", "base_path"]
      properties:
        listening_port:
          type: "integer"
          title: "Listening Port"
          default: 8083
        base_path:
          type: "string"
          title: "Base Path"
          default: "/api/process/csv"
        max_payload_size:
          type: "string"
          title: "Max Payload Size"
          default: "100 MB"

    csv_options:
      type: "object"
      title: "CSV Processing Options"
      properties:
        has_headers:
          type: "boolean"
          title: "File has headers"
          default: true
        delimiter:
          type: "string"
          title: "Field delimiter"
          enum: [",", ";", "|", "\t"]
          default: ","
        output_format:
          type: "string"
          title: "Output format"
          enum: ["json", "xml", "excel", "parquet"]
          default: "json"

    filtering:
      type: "object"
      title: "Data Filtering Options"
      properties:
        filter_column:
          type: "string"
          title: "Filter by column (optional)"
        filter_value:
          type: "string"
          title: "Filter value (optional)"

# UI Configuration for Dynamic Interface Generation
ui_configuration:
  input:
    title: "📈 CSV Data Input"
    accepted_file_types: [".csv", ".tsv"]
    placeholder_text: "Upload your CSV file or paste data here..."
    supports_text_input: true
    supports_file_upload: true
    max_file_size_mb: 100
  processing_options:
    - name: "has_headers"
      type: "boolean"
      label: "File has headers"
      description: "First row contains column names"
      default_value: true
    - name: "delimiter"
      type: "select"
      label: "Field delimiter"
      description: "Character used to separate fields"
      options: [",", ";", "|", "\\t"]
      default_value: ","
    - name: "output_format"
      type: "select"
      label: "Output format"
      description: "Format to convert the data to"
      options: ["json", "xml", "excel", "parquet"]
      default_value: "json"
    - name: "filter_column"
      type: "string"
      label: "Filter by column (optional)"
      description: "Column name to filter by"
    - name: "filter_value"
      type: "string"
      label: "Filter value (optional)"
      description: "Value to filter for"
    - name: "max_rows"
      type: "number"
      label: "Max rows to process"
      description: "Limit the number of rows processed"
      min_value: 1
      max_value: 1000000
      default_value: 50000
  outputs:
    - name: "converted_data"
      label: "Converted Data"
      type: "download"
      description: "Data converted to selected format"
    - name: "processing_summary"
      label: "Processing Summary"
      type: "display"
      description: "Summary of processing results"
    - name: "data_preview"
      label: "Data Preview"
      type: "display"
      description: "First 10 rows of processed data"
    - name: "column_info"
      label: "Column Information"
      type: "display"
      description: "Detected columns and data types"

# Processing Capabilities
processing_capabilities:
  - "transformation"
  - "filtering"
  - "validation"
  - "format_conversion"

# Supported File Types
supported_file_types:
  - ".csv"
  - ".tsv"

# Use Cases
use_cases:
  - "data_conversion"
  - "data_cleaning"
  - "analytics_prep"
  - "format_migration"

# Industry Tags
industry_tags:
  - "general"
  - "data_analytics"
  - "business_intelligence"
  - "reporting"