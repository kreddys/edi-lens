# Real-time EDI Processor Template
# Processes EDI transactions via HTTP endpoints with optional format translation

metadata:
  template_id: "global-realtime-edi-processor-v1.0"
  name: "Real-time EDI Processor"
  description: "Processes EDI transactions via HTTP endpoints with optional format translation and real-time response"
  category: "REALTIME"
  scope: "GLOBAL"
  tenant_id: null
  maintainer: "edi-lens-platform"
  based_on: null
  version: "1.0"
  deployment_method: "registry"
  tags:
    - "http"
    - "edi"
    - "realtime"
    - "api"
    - "synchronous"
    - "translation"
  features:
    - "http-listener"
    - "real-time-validation"
    - "immediate-response"
    - "ta1-generation"
    - "api-integration"
    - "format-translation"
    - "configurable-translation"
  is_featured: true
  status: "ACTIVE"

# NiFi Flow Definition
flow_definition:
  processors:
    - id: "listen-http-processor"
      type: "ListenHTTP"
      name: "HTTP EDI Endpoint"
      position:
        x: 100
        y: 100
      properties:
        Listening Port: "${HTTP_LISTENING_PORT}"
        Base Path: "${HTTP_BASE_PATH}"
        HTTP Context Map: "edi-http-context"
        HTTP Headers to Receive as Attributes: "Authorization,X-Tenant-ID,Content-Type"
        Max Data Size: "${MAX_PAYLOAD_SIZE}"
        Max Thread Pool Size: "${MAX_THREADS}"

    - id: "extract-tenant-processor"
      type: "UpdateAttribute"
      name: "Extract Tenant Info"
      position:
        x: 350
        y: 100
      properties:
        tenant.id: "${http.headers.X-Tenant-ID}"
        authorization: "${http.headers.Authorization}"
        request.timestamp: "${now()}"
        content.type: "${http.headers.Content-Type}"

    - id: "validate-auth-processor"
      type: "RouteOnAttribute"
      name: "Validate Authentication"
      position:
        x: 600
        y: 100
      properties:
        Routing Strategy: "Route to Property name"
      dynamic_properties:
        authenticated: "${authorization:startsWith('Bearer ')}"

    # Conditional Input Translation Processor
    - id: "input-translation-processor"
      type: "InvokeHTTP"
      name: "Translate Input Format"
      position:
        x: 750
        y: 50
      properties:
        HTTP Method: "POST"
        Remote URL: "http://backend:8000/api/v1/edi/transform"
        Content-Type: "application/json"
        Authorization: "Bearer ${EDI_BACKEND_SERVICE_TOKEN}"
        Request Body: |
          {
            "input_content": "${flowfile:content}",
            "input_format": "${INPUT_TRANSLATION_SOURCE_FORMAT}",
            "output_format": "EDI",
            "mapping_rules": ${INPUT_TRANSLATION_MAPPING_RULES},
            "tenant_id": "${tenant.id}",
            "workflow_id": "${WORKFLOW_ID}"
          }
      condition: "${INPUT_TRANSLATION_ENABLED:equals('true')}"

    - id: "route-translation-processor"
      type: "RouteOnAttribute"
      name: "Route Translation Path"
      position:
        x: 750
        y: 100
      properties:
        Routing Strategy: "Route to Property name"
      dynamic_properties:
        "needs_translation": "${INPUT_TRANSLATION_ENABLED:equals('true')}"
        "direct_processing": "${INPUT_TRANSLATION_ENABLED:equals('false')}"

    - id: "validate-edi-realtime-processor"
      type: "InvokeHTTP"
      name: "Validate EDI Real-time"
      position:
        x: 1000
        y: 100
      properties:
        HTTP Method: "POST"
        Remote URL: "http://backend:8000/api/v1/edi/validate-realtime"
        Content-Type: "application/json"
        Authorization: "Bearer ${EDI_BACKEND_SERVICE_TOKEN}"
        Request Timeout: "${REQUEST_TIMEOUT}"
        Request Body: |
          {
            "edi_content": "${flowfile:content}",
            "tenant_id": "${tenant.id}",
            "workflow_id": "${WORKFLOW_ID}",
            "validation_schema": "${VALIDATION_SCHEMA}",
            "snip_level": ${SNIP_LEVEL},
            "generate_ta1": ${GENERATE_TA1},
            "generate_999": ${GENERATE_999}
          }

    # Conditional Output Translation Processor
    - id: "output-translation-processor"
      type: "InvokeHTTP"
      name: "Translate Output Format"
      position:
        x: 1200
        y: 50
      properties:
        HTTP Method: "POST"
        Remote URL: "http://backend:8000/api/v1/edi/transform"
        Content-Type: "application/json"
        Authorization: "Bearer ${EDI_BACKEND_SERVICE_TOKEN}"
        Request Body: |
          {
            "input_content": "${http.response.body}",
            "input_format": "EDI",
            "output_format": "${OUTPUT_TRANSLATION_TARGET_FORMAT}",
            "mapping_rules": ${OUTPUT_TRANSLATION_MAPPING_RULES},
            "tenant_id": "${tenant.id}",
            "workflow_id": "${WORKFLOW_ID}"
          }
      condition: "${OUTPUT_TRANSLATION_ENABLED:equals('true')}"

    - id: "route-output-processor"
      type: "RouteOnAttribute"
      name: "Route Output Path"
      position:
        x: 1200
        y: 100
      properties:
        Routing Strategy: "Route to Property name"
      dynamic_properties:
        "needs_output_translation": "${OUTPUT_TRANSLATION_ENABLED:equals('true')}"
        "direct_response": "${OUTPUT_TRANSLATION_ENABLED:equals('false')}"

    - id: "format-success-response-processor"
      type: "ReplaceText"
      name: "Format Success Response"
      position:
        x: 1400
        y: 100
      properties:
        Search Value: "(.*)"
        Replacement Value: "${flowfile:content}"
        Replacement Strategy: "Always Replace"

    - id: "format-error-response-processor"
      type: "ReplaceText"
      name: "Format Error Response"
      position:
        x: 1400
        y: 200
      properties:
        Search Value: "(.*)"
        Replacement Value: |
          {
            "error": {
              "code": "AUTHENTICATION_FAILED",
              "message": "Invalid or missing authentication token",
              "timestamp": "${request.timestamp}"
            }
          }
        Replacement Strategy: "Always Replace"

    - id: "set-response-headers-processor"
      type: "UpdateAttribute"
      name: "Set Response Headers"
      position:
        x: 1600
        y: 100
      properties:
        http.status.code: "${http.status.code:ifEmpty('200')}"
        http.status.message: "OK"
        Content-Type: "application/json"

    - id: "log-request-processor"
      type: "LogAttribute"
      name: "Log API Request"
      position:
        x: 1800
        y: 100
      properties:
        Log Level: "info"
        Log Prefix: "Real-time EDI Request"
        Attributes to Log: "tenant.id,http.request.uri,request.timestamp,http.status.code"

  connections:
    - identifier: "listen-to-extract-connection"
      name: "Listen to Extract"
      source:
        id: "listen-http-processor"
        type: "PROCESSOR"
      destination:
        id: "extract-tenant-processor"
        type: "PROCESSOR"
      selectedRelationships: ["success"]
    
    - identifier: "extract-to-validate-connection"
      name: "Extract to Validate"
      source:
        id: "extract-tenant-processor"
        type: "PROCESSOR"
      destination:
        id: "validate-auth-processor"
        type: "PROCESSOR"
      selectedRelationships: ["success"]
    
    - identifier: "validate-to-route-connection"
      name: "Validate to Route"
      source:
        id: "validate-auth-processor"
        type: "PROCESSOR"
      destination:
        id: "route-translation-processor"
        type: "PROCESSOR"
      selectedRelationships: ["authenticated"]
    
    # Input translation flow
    - identifier: "route-to-input-translation-connection"
      name: "Route to Input Translation"
      source:
        id: "route-translation-processor"
        type: "PROCESSOR"
      destination:
        id: "input-translation-processor"
        type: "PROCESSOR"
      selectedRelationships: ["needs_translation"]
    
    - identifier: "input-translation-to-validate-connection"
      name: "Input Translation to Validate"
      source:
        id: "input-translation-processor"
        type: "PROCESSOR"
      destination:
        id: "validate-edi-realtime-processor"
        type: "PROCESSOR"
      selectedRelationships: ["response"]
    
    # Direct processing flow
    - identifier: "route-to-validate-direct-connection"
      name: "Route to Validate Direct"
      source:
        id: "route-translation-processor"
        type: "PROCESSOR"
      destination:
        id: "validate-edi-realtime-processor"
        type: "PROCESSOR"
      selectedRelationships: ["direct_processing"]
    
    - identifier: "validate-to-route-output-connection"
      name: "Validate to Route Output"
      source:
        id: "validate-edi-realtime-processor"
        type: "PROCESSOR"
      destination:
        id: "route-output-processor"
        type: "PROCESSOR"
      selectedRelationships: ["response"]
    
    # Output translation flow
    - identifier: "route-output-to-translation-connection"
      name: "Route Output to Translation"
      source:
        id: "route-output-processor"
        type: "PROCESSOR"
      destination:
        id: "output-translation-processor"
        type: "PROCESSOR"
      selectedRelationships: ["needs_output_translation"]
    
    - identifier: "output-translation-to-format-connection"
      name: "Output Translation to Format"
      source:
        id: "output-translation-processor"
        type: "PROCESSOR"
      destination:
        id: "format-success-response-processor"
        type: "PROCESSOR"
      selectedRelationships: ["response"]
    
    # Direct response flow
    - identifier: "route-output-to-format-direct-connection"
      name: "Route Output to Format Direct"
      source:
        id: "route-output-processor"
        type: "PROCESSOR"
      destination:
        id: "format-success-response-processor"
        type: "PROCESSOR"
      selectedRelationships: ["direct_response"]
    
    - identifier: "format-to-headers-connection"
      name: "Format to Headers"
      source:
        id: "format-success-response-processor"
        type: "PROCESSOR"
      destination:
        id: "set-response-headers-processor"
        type: "PROCESSOR"
      selectedRelationships: ["success"]
    
    - identifier: "headers-to-log-connection"
      name: "Headers to Log"
      source:
        id: "set-response-headers-processor"
        type: "PROCESSOR"
      destination:
        id: "log-request-processor"
        type: "PROCESSOR"
      selectedRelationships: ["success"]
      relationship: "success"
    
    # Error handling
    - source: "validate-auth-processor"
      destination: "format-error-response-processor"
      relationship: "unmatched"
    
    - source: "format-error-response-processor"
      destination: "set-response-headers-processor"
      relationship: "success"

# Configuration Schema for UI Generation
configuration_schema:
  type: "object"
  required:
    - "endpoint_config"
    - "validation"
  properties:
    translation:
      type: "object"
      title: "Translation Configuration"
      description: "Optional format translation settings"
      properties:
        input_translation:
          type: "object"
          title: "Input Translation"
          properties:
            enabled:
              type: "boolean"
              title: "Enable Input Translation"
              description: "Convert input data to EDI before processing"
              default: false
            source_format:
              type: "string"
              title: "Source Format"
              description: "Format of input data to convert"
              enum: ["JSON", "XML", "CSV"]
            mapping_rules:
              type: "object"
              title: "Input Mapping Rules"
              description: "Custom mapping rules for input translation"
        output_translation:
          type: "object"
          title: "Output Translation"
          properties:
            enabled:
              type: "boolean"
              title: "Enable Output Translation"
              description: "Convert processed EDI to other formats in response"
              default: false
            target_format:
              type: "string"
              title: "Target Format"
              description: "Format to convert processed EDI to"
              enum: ["JSON", "XML", "CSV"]
            mapping_rules:
              type: "object"
              title: "Output Mapping Rules"
              description: "Custom mapping rules for output translation"

    endpoint_config:
      type: "object"
      title: "HTTP Endpoint Configuration"
      required: ["listening_port", "base_path"]
      properties:
        listening_port:
          type: "integer"
          title: "Listening Port"
          description: "Port for HTTP endpoint"
          minimum: 1024
          maximum: 65535
          examples: [8081]
        base_path:
          type: "string"
          title: "Base Path"
          description: "HTTP base path for the endpoint"
          pattern: "^/api/workflows/[^/]+/process$"
          examples: ["/api/workflows/realtime-claims-001/process"]
        max_payload_size:
          type: "string"
          title: "Max Payload Size"
          description: "Maximum request payload size"
          default: "10 MB"
          pattern: "^\\d+\\s+(KB|MB|GB)$"
        request_timeout:
          type: "string"
          title: "Request Timeout"
          description: "Maximum processing time per request"
          default: "30 seconds"
          pattern: "^\\d+\\s+(seconds|minutes)$"
        max_concurrent_requests:
          type: "integer"
          title: "Max Concurrent Requests"
          description: "Maximum concurrent requests to process"
          default: 10
          minimum: 1
          maximum: 100

    validation:
      type: "object"
      title: "Validation Configuration"
      required: ["schema"]
      properties:
        schema:
          type: "string"
          title: "EDI Schema"
          description: "EDI schema file for validation"
          examples: ["270.5010.X279.A1.json"]
        snip_level:
          type: "integer"
          title: "SNIP Level"
          description: "Validation strictness level for real-time processing"
          minimum: 1
          maximum: 5
          default: 2

    acknowledgments:
      type: "object"
      title: "Acknowledgment Configuration"
      properties:
        generate_ta1:
          type: "boolean"
          title: "Generate TA1"
          description: "Include TA1 acknowledgment in response"
          default: true
        generate_999:
          type: "boolean"
          title: "Generate 999"
          description: "Include 999 acknowledgment in response"
          default: false

    security:
      type: "object"
      title: "Security Configuration"
      properties:
        require_authentication:
          type: "boolean"
          title: "Require Authentication"
          description: "Require Bearer token authentication"
          default: true
        allowed_content_types:
          type: "array"
          title: "Allowed Content Types"
          description: "Permitted request content types"
          items:
            type: "string"
          default: ["application/json", "text/plain", "application/edi-x12"]

# UI Configuration for Dynamic Interface Generation
ui_configuration:
  input:
    title: "📄 EDI Document Input"
    accepted_file_types: [".edi", ".x12", ".txt"]
    placeholder_text: "Paste your EDI content here for real-time processing..."
    supports_text_input: true
    supports_file_upload: true
    max_file_size_mb: 5
  processing_options:
    - name: "generate_ta1"
      type: "boolean"
      label: "Generate TA1 Acknowledgment"
      description: "Include TA1 acknowledgment in response"
      default_value: true
    - name: "generate_999"
      type: "boolean"
      label: "Generate 999 Acknowledgment"
      description: "Include 999 acknowledgment in response"
      default_value: false
    - name: "validation_schema"
      type: "select"
      label: "Validation Schema"
      description: "EDI schema to use for validation"
      options: ["270.5010.X279.A1.json", "271.5010.X279.A1.json", "837.5010.X222.A1.json"]
      default_value: "270.5010.X279.A1.json"
    - name: "snip_level"
      type: "select"
      label: "Validation Level"
      description: "SNIP validation strictness level for real-time processing"
      options: ["1", "2", "3", "4", "5"]
      default_value: "2"
    - name: "request_timeout"
      type: "select"
      label: "Request Timeout"
      description: "Maximum processing time per request"
      options: ["10 seconds", "30 seconds", "60 seconds"]
      default_value: "30 seconds"
  outputs:
    - name: "ta1_acknowledgment"
      label: "TA1 Response"
      type: "download"
      description: "Technical acknowledgment"
      file_extension: ".edi"
    - name: "ack999_acknowledgment"
      label: "999 Response"
      type: "download"
      description: "Functional acknowledgment"
      file_extension: ".edi"
    - name: "validation_report"
      label: "Validation Results"
      type: "display"
      description: "Real-time validation findings"
    - name: "api_response"
      label: "API Response"
      type: "display"
      description: "Complete API response data"

# Processing Capabilities
processing_capabilities:
  - "validation"
  - "acknowledgment_generation"
  - "real_time_processing"
  - "http_api"

# Supported File Types
supported_file_types:
  - ".edi"
  - ".x12"
  - ".txt"

# Use Cases
use_cases:
  - "real_time_validation"
  - "api_integration"
  - "immediate_response"
  - "transaction_processing"

# Industry Tags
industry_tags:
  - "healthcare"
  - "finance"
  - "real_time_trading"
  - "api_services"