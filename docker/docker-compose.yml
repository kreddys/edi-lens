# Docker Compose for NiFi Development
# Simple NiFi + Registry + Database + Backend setup
# Clean architecture focusing on core functionality

services:
  db:
    image: postgres:16-alpine
    container_name: edi-lens-db
    env_file:
      - ../.env.local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/create-multiple-dbs.sh:/docker-entrypoint-initdb.d/create-multiple-dbs.sh
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edi_lens_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nifi-registry:
    image: apache/nifi-registry:2.5.0
    container_name: edi-lens-registry
    user: "0:0"  # Run as root to fix permissions
    env_file:
      - ../.env.local
    environment:
      NIFI_REGISTRY_WEB_HTTP_HOST: ${NIFI_REGISTRY_WEB_HTTP_HOST}
      NIFI_REGISTRY_WEB_HTTP_PORT: ${NIFI_REGISTRY_WEB_HTTP_PORT}
      NIFI_REGISTRY_DB_URL: ${NIFI_REGISTRY_DB_URL}
      NIFI_REGISTRY_DB_USER: ${NIFI_REGISTRY_DB_USER}
      NIFI_REGISTRY_DB_PASS: ${NIFI_REGISTRY_DB_PASS}
      NIFI_REGISTRY_DB_CLASS: ${NIFI_REGISTRY_DB_CLASS}
      NIFI_REGISTRY_DB_DRIVER_CLASS: ${NIFI_REGISTRY_DB_DRIVER_CLASS}
      NIFI_REGISTRY_DB_DRIVER_DIRECTORY: ${NIFI_REGISTRY_DB_DRIVER_DIRECTORY}
    ports:
      - "18080:18080"
    volumes:
      - nifi_registry_data:/opt/nifi-registry/nifi-registry-current/database
      - nifi_registry_flows:/opt/nifi-registry/nifi-registry-current/flow_storage
      # Mount PostgreSQL JDBC driver
      - ./nifi-registry/postgresql-42.7.4.jar:/opt/nifi-registry/nifi-registry-current/lib/postgresql-42.7.4.jar
    networks:
      - edi_lens_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/nifi-registry-api/config"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  nifi:
    image: apache/nifi:2.5.0
    container_name: edi-lens-nifi
    env_file:
      - ../.env.local
    environment:
      # Accept HTTPS mode (NiFi 2.5.0 Docker prefers HTTPS)
      NIFI_WEB_HTTPS_PORT: ${NIFI_WEB_HTTPS_PORT}
      NIFI_WEB_HTTPS_HOST: ${NIFI_WEB_HTTPS_HOST}
      # Add proxy configuration to accept Docker service names
      NIFI_WEB_PROXY_HOST: ${NIFI_WEB_PROXY_HOST}

      # Single user authentication (minimum 12 chars password)
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}

      # Required for property encryption
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY}

      # JVM settings for development
      NIFI_JVM_HEAP_INIT: ${NIFI_JVM_HEAP_INIT}
      NIFI_JVM_HEAP_MAX: ${NIFI_JVM_HEAP_MAX}

    ports:
      - "8443:8443"
    volumes:
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
      # Mount test data directory for e2e tests
      - ../backend/tests/data:/opt/nifi/test_data
      # Mount entire nifi-working directory for flow testing
      - ../tmp/nifi-working:/tmp/nifi-working
      # Note: conf volume removed to allow NiFi to write authentication files
    networks:
      - edi_lens_network
    depends_on:
      nifi-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8443/nifi/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

# Backend runs locally in development mode, not in container
# For container deployment, use docker-compose.prod.yml override

volumes:
  postgres_data:
  nifi_registry_data:
  nifi_registry_flows:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  nifi_state:

networks:
  edi_lens_network:
    driver: bridge
