# Docker Compose for NiFi Development
# Simple NiFi + Registry + Database + Backend setup
# Clean architecture focusing on core functionality

services:
  db:
    image: postgres:16-alpine
    container_name: edi-lens-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edi_lens
      # NiFi Registry database
      POSTGRES_MULTIPLE_DATABASES: nifi_registry
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/create-multiple-dbs.sh:/docker-entrypoint-initdb.d/create-multiple-dbs.sh
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edi_lens_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nifi-registry:
    image: apache/nifi-registry:2.5.0
    container_name: edi-lens-registry
    environment:
      NIFI_REGISTRY_WEB_HTTP_HOST: 0.0.0.0
      NIFI_REGISTRY_WEB_HTTP_PORT: 18080
      # Use database for persistence
      NIFI_REGISTRY_DB_URL: jdbc:postgresql://db:5432/nifi_registry
      NIFI_REGISTRY_DB_USER: postgres
      NIFI_REGISTRY_DB_PASS: postgres
      NIFI_REGISTRY_DB_CLASS: org.postgresql.Driver
      NIFI_REGISTRY_DB_DRIVER_CLASS: org.postgresql.Driver
      NIFI_REGISTRY_DB_DRIVER_DIRECTORY: /opt/nifi-registry/nifi-registry-current/lib
    ports:
      - "18080:18080"
    volumes:
      - nifi_registry_data:/opt/nifi-registry/nifi-registry-current/database
      - nifi_registry_flows:/opt/nifi-registry/nifi-registry-current/flow_storage
      # Mount PostgreSQL JDBC driver
      - ./nifi-registry/postgresql-42.7.4.jar:/opt/nifi-registry/nifi-registry-current/lib/postgresql-42.7.4.jar
    networks:
      - edi_lens_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/nifi-registry/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nifi:
    image: apache/nifi:2.5.0
    container_name: edi-lens-nifi
    environment:
      # Accept HTTPS mode (NiFi 2.5.0 Docker prefers HTTPS)
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_WEB_HTTPS_HOST: 0.0.0.0

      # Single user authentication (minimum 12 chars password)
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: adminadmin123

      # Required for property encryption
      NIFI_SENSITIVE_PROPS_KEY: 'simple-key-for-development'

      # JVM settings for development
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 2g

    ports:
      - "8443:8443"
    volumes:
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
      # Note: conf volume removed to allow NiFi to write authentication files
    networks:
      - edi_lens_network
    depends_on:
      nifi-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8443/nifi/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: edi-lens-backend
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/edi_lens

      # NiFi configuration - HTTPS URLs with single user auth
      NIFI_URL: https://nifi:8443
      NIFI_USERNAME: admin
      NIFI_PASSWORD: adminadmin123

      # NiFi Registry configuration
      NIFI_REGISTRY_URL: http://nifi-registry:18080
      NIFI_REGISTRY_AUTH_TOKEN: ''

      # Development mode
      DEBUG: "true"

    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app:delegated
      - /app/.venv  # Exclude venv from sync
    networks:
      - edi_lens_network
    depends_on:
      db:
        condition: service_healthy
      nifi:
        condition: service_healthy
      nifi-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  nifi_registry_data:
  nifi_registry_flows:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  nifi_state:

networks:
  edi_lens_network:
    driver: bridge