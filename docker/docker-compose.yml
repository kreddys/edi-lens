# FILE: docker/docker-compose.yml
# BASE configuration for LOCAL DEVELOPMENT and AUTOMATED TESTING.
# All paths are relative to this file's location inside the /docker directory.

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "3001:3001" # Main app port
      - "8081:8081" # Keycloak UI port
      - "9001:9001" # MinIO Console port
      - "8082:8082" # SFTPGo UI port
      - "8080:8080" # NiFi UI port
      - "18080:18080" # NiFi Registry UI port
    volumes:
      - ./caddy/dev.Caddyfile:/etc/caddy/Caddyfile
    networks:
      - edi_lens_network
    depends_on: [backend, admin-ui, keycloak, sftpgo]

  db-keycloak:
    image: postgres:15-alpine
    container_name: db-keycloak
    environment:
      POSTGRES_USER: ${POSTGRES_KC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KC_PASSWORD}
      POSTGRES_DB: ${POSTGRES_KC_DB}
    volumes:
      - postgres_kc_data:/var/lib/postgresql/data/
    networks:
      - edi_lens_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_KC_USER} -d ${POSTGRES_KC_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-app:
    build:
      context: ..
      dockerfile: docker/postgres/Dockerfile
    container_name: db-app
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SFTPGO_USER: ${POSTGRES_SFTPGO_USER}
      POSTGRES_SFTPGO_PASSWORD: ${POSTGRES_SFTPGO_PASSWORD}
      POSTGRES_SFTPGO_DB: ${POSTGRES_SFTPGO_DB}
      POSTGRES_NIFI_REGISTRY_USER: ${POSTGRES_NIFI_REGISTRY_USER}
      POSTGRES_NIFI_REGISTRY_PASSWORD: ${POSTGRES_NIFI_REGISTRY_PASSWORD}
      POSTGRES_NIFI_REGISTRY_DB: ${POSTGRES_NIFI_REGISTRY_DB}      
    volumes:
      # ./ is now the /docker directory
      - ./postgres/init-app-dbs.sh:/docker-entrypoint-initdb.d/init-app-dbs.sh
      - ./postgres/healthcheck.sh:/usr/local/bin/healthcheck.sh
    networks:
      - edi_lens_network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    depends_on: { db-keycloak: { condition: service_healthy } }
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # Database Connection
      - KC_DB=postgres
      - KC_DB_URL_HOST=${POSTGRES_KC_HOST}
      - KC_DB_URL_DATABASE=${POSTGRES_KC_DB}
      - KC_DB_USERNAME=${POSTGRES_KC_USER}
      - KC_DB_PASSWORD=${POSTGRES_KC_PASSWORD}
      # HTTP & Proxy Settings
      - KC_HTTP_ENABLED=true
      - KC_PROXY=edge
      - KC_HOSTNAME_STRICT=false
      # This explicitly tells Keycloak its public-facing URL, which it will use
      # for generating redirects and reporting its "issuer" URL.
      #- KC_HOSTNAME=localhost:8081
    networks:
      - edi_lens_network
    # `start-dev` is crucial for local development. It skips the lengthy 'build'
    # phase that the production start command requires, leading to much faster startups.
    command: start-dev      

  backend:
    build:
      context: .. # <-- CHANGE: Go up one level to the project root for context
      dockerfile: docker/backend/Dockerfile
      target: test
    container_name: backend
    depends_on:
      - db-app
      - keycloak
      - minio
    volumes:
      - ../backend:/home/appuser/app:delegated # <-- CHANGE: Go up one level
      - /home/appuser/app/.venv
      - sftp_tenant_data:/sftp/tenants
    networks: [ edi_lens_network ]
    env_file: [ ../.env.dev ] # <-- CHANGE: Go up one level
    environment:
      - WAIT_FOR_KEYCLOAK=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Give it extra time to start up and run migrations    
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src --reload-dir alembic

  admin-ui:
    build:
      context: .. # <-- CHANGE: Go up one level to the project root for context
      dockerfile: docker/admin-ui/Dockerfile.dev
    container_name: admin-ui
    volumes:
      - ../admin-ui:/app:delegated # <-- CHANGE: Go up one level
      - admin-ui-node-modules:/app/node_modules
    env_file: [ ../.env.dev ] # <-- CHANGE: Go up one level
    depends_on: [ backend ]
    networks: [ edi_lens_network ]
    command: npm run dev -- --host 0.0.0.0 --port 3000

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY:-minioadmin}
      - MINIO_DOMAIN=minio.localhost
    networks:
      - edi_lens_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  create-minio-bucket:
    image: minio/mc:latest
    container_name: create-minio-bucket
    profiles:
      - setup
    depends_on:
      - minio
    environment:
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-edi-lens}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      until (/usr/bin/mc alias set local-minio http://minio:9000 $STORAGE_ACCESS_KEY $STORAGE_SECRET_KEY) do echo '...retrying connection to minio' && sleep 1; done;
      echo 'MinIO is ready. Creating bucket...';
      /usr/bin/mc mb local-minio/$STORAGE_BUCKET --ignore-existing;
      /usr/bin/mc policy set public local-minio/$STORAGE_BUCKET;
      echo 'Bucket setup complete.';
      exit 0;
      "
    networks:
      - edi_lens_network

  sftpgo:
    image: drakkan/sftpgo:v2.6
    container_name: sftpgo
    hostname: sftpgo
    # Run as root to allow pipe file creation - this is the recommended approach from SFTPGo docs
    user: "0:0"
    environment:
      # --- SFTPGo Default Admin Credentials ---
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${SFTPGO_ADMIN_USER}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD}
      
      # --- Data Provider Configuration (PostgreSQL) ---
      SFTPGO_DATA_PROVIDER__DRIVER: "postgresql"
      SFTPGO_DATA_PROVIDER__NAME: "${POSTGRES_SFTPGO_DB}"
      SFTPGO_DATA_PROVIDER__HOST: "${POSTGRES_HOST}"
      SFTPGO_DATA_PROVIDER__PORT: "5432"
      SFTPGO_DATA_PROVIDER__USERNAME: "${POSTGRES_SFTPGO_USER}"
      SFTPGO_DATA_PROVIDER__PASSWORD: "${POSTGRES_SFTPGO_PASSWORD}"
      SFTPGO_DATA_PROVIDER__SSLMODE: "0" # 0 means disabled
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"

      # --- OIDC Configuration (Keycloak) ---
      SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_ID: "sftpgo"
      SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_SECRET: "${KEYCLOAK_SFTPGO_CLIENT_SECRET}"
      # This URL is for container-to-container communication. It must use the internal service name.
      SFTPGO_HTTPD__BINDINGS__0__OIDC__CONFIG_URL: "${KEYCLOAK_URL}/realms/edi-lens"
      SFTPGO_HTTPD__BINDINGS__0__OIDC__REDIRECT_BASE_URL: "http://localhost:8082"
      SFTPGO_HTTPD__BINDINGS__0__OIDC__INSECURE_SKIP_SIGNATURE_CHECK: "false"
      SFTPGO_HTTPD__BINDINGS__0__OIDC__SCOPES: "openid,profile,email,groups"
      SFTPGO_HTTPD__BINDINGS__0__OIDC__USERNAME_FIELD: "preferred_username"
      SFTPGO_HTTPD__BINDINGS__0__OIDC__ROLE_FIELD: "groups"
      SFTPGO_HTTPD__BINDINGS__0__OIDC__AUTO_CREATE_USER: "true"

      # Event hooks are configured via SFTPGo API (see event actions and rules)
    volumes:
      - sftpgo_data:/var/lib/sftpgo/
    ports:
      - "2022:2022"
    networks:
      - edi_lens_network
    depends_on:
      - db-app
      - minio
      - keycloak
      - backend
    restart: unless-stopped
    command: sftpgo serve


  nifi:
    image: apache/nifi:1.23.2
    container_name: nifi
    hostname: nifi
    environment:
      # Basic Configuration
      - NIFI_WEB_HTTP_HOST=0.0.0.0
      - NIFI_WEB_HTTP_PORT=8080
      - NIFI_CLUSTER_IS_NODE=false
      - NIFI_SENSITIVE_PROPS_KEY=${NIFI_SENSITIVE_PROPS_KEY}
      
      # Security Configuration
      - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_ADMIN_USER}
      - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_ADMIN_PASSWORD}
      
      # OIDC Configuration (Keycloak Integration)
      - NIFI_SECURITY_USER_OIDC_DISCOVERY_URL=${KEYCLOAK_URL}/realms/edi-lens/.well-known/openid_configuration
      - NIFI_SECURITY_USER_OIDC_CLIENT_ID=nifi
      - NIFI_SECURITY_USER_OIDC_CLIENT_SECRET=${KEYCLOAK_NIFI_CLIENT_SECRET}
      - NIFI_SECURITY_USER_OIDC_PREFERRED_JWSALGORITHM=RS256
      
      # JVM Configuration
      - NIFI_JVM_HEAP_INIT=${NIFI_JVM_HEAP_INIT}
      - NIFI_JVM_HEAP_MAX=${NIFI_JVM_HEAP_MAX}
      
      # Backend Integration
      - EDI_BACKEND_URL=http://backend:8000
      
    # ports:
      # - "8080:8080"  # Proxied through Caddy instead
    volumes:
      # Data persistence
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - nifi_conf:/opt/nifi/nifi-current/conf
      
      # SFTP access
      - sftp_tenant_data:/sftp/tenants:ro
      
    networks:
      - edi_lens_network
    depends_on:
      - keycloak
      - backend
      - nifi-registry
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nifi-api/system-diagnostics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Init container to fix NiFi Registry volume permissions
  nifi-registry-init:
    image: alpine:latest
    container_name: nifi-registry-init
    profiles:
      - setup
    volumes:
      - nifi_registry_data:/opt/nifi-registry/nifi-registry-current/database
      - nifi_registry_flow_storage:/opt/nifi-registry/nifi-registry-current/flow_storage
    command: >
      sh -c "
      echo 'Fixing NiFi Registry volume permissions...';
      chown -R 1000:1000 /opt/nifi-registry/nifi-registry-current/database;
      chown -R 1000:1000 /opt/nifi-registry/nifi-registry-current/flow_storage;
      chmod -R 755 /opt/nifi-registry/nifi-registry-current/database;
      chmod -R 755 /opt/nifi-registry/nifi-registry-current/flow_storage;
      echo 'NiFi Registry permissions fixed.';
      "
    networks:
      - edi_lens_network

  nifi-registry:
    image: apache/nifi-registry:1.23.2
    container_name: nifi-registry
    environment:
      - NIFI_REGISTRY_WEB_HTTP_HOST=0.0.0.0
      - NIFI_REGISTRY_WEB_HTTP_PORT=18080
      - NIFI_REGISTRY_DB_URL=jdbc:postgresql://db-app:5432/${POSTGRES_NIFI_REGISTRY_DB}
      - NIFI_REGISTRY_DB_USER=${POSTGRES_NIFI_REGISTRY_USER}
      - NIFI_REGISTRY_DB_PASS=${POSTGRES_NIFI_REGISTRY_PASSWORD}
      - NIFI_REGISTRY_DB_CLASS=org.postgresql.Driver
      - NIFI_REGISTRY_DB_DRIVER_CLASS=org.postgresql.Driver
      - NIFI_REGISTRY_DB_DRIVER_DIRECTORY=/opt/nifi-registry/nifi-registry-current/lib
    # ports:
      # - "18080:18080"  # Proxied through Caddy instead
    volumes:
      - nifi_registry_data:/opt/nifi-registry/nifi-registry-current/database
      - nifi_registry_flow_storage:/opt/nifi-registry/nifi-registry-current/flow_storage
      # Mount PostgreSQL JDBC driver
      - ./nifi-registry/postgresql-42.7.4.jar:/opt/nifi-registry/nifi-registry-current/lib/postgresql-42.7.4.jar
    user: "1000:1000"  # Now safe to use after init container fixes permissions
    networks:
      - edi_lens_network
    depends_on:
      db-app:
        condition: service_healthy

volumes:
  postgres_kc_data: {}
  postgres_app_data: {}
  admin-ui-node-modules: {}
  minio_data: {}
  sftpgo_data: {}
  sftp_tenant_data: {}
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_content_repository:
  nifi_provenance_repository:
  nifi_conf:
  nifi_registry_data:
  nifi_registry_flow_storage:

networks:
  edi_lens_network:
    driver: bridge