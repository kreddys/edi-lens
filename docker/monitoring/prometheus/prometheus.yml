# FILE: docker/monitoring/prometheus/prometheus.yml
# Prometheus configuration for EDI Lens

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape configuration for EDI Lens services
  - job_name: "edi-lens-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/api/v1/metrics"
    scrape_interval: 10s

  - job_name: "edi-lens-frontend"
    static_configs:
      - targets: ["frontend:3000"]
    scrape_interval: 10s

  - job_name: "edi-lens-db"
    static_configs:
      - targets: ["db:9187"]
    # Note: You'll need to add the postgres_exporter service to monitor PostgreSQL
    scrape_interval: 30s

  - job_name: "edi-lens-keycloak"
    static_configs:
      - targets: ["keycloak:8080"]
    scrape_interval: 30s

  - job_name: "edi-lens-minio"
    static_configs:
      - targets: ["minio:9000"]
    scrape_interval: 30s

  - job_name: "edi-lens-sftpgo"
    static_configs:
      - targets: ["sftpgo:8080"]
    scrape_interval: 30s

  - job_name: "edi-lens-nifi"
    static_configs:
      - targets: ["nifi:8080"]
    scrape_interval: 30s

  - job_name: "edi-lens-nifi-registry"
    static_configs:
      - targets: ["nifi-registry:18080"]
    scrape_interval: 30s

  # Monitoring services
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
    scrape_interval: 30s

  - job_name: "prometheus-monitor"
    static_configs:
      - targets: ["prometheus:9090"]
    scrape_interval: 30s

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    scrape_interval: 30s