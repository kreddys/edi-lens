# FILE: docker/monitoring/prometheus/prometheus.yml
# Prometheus configuration for EDI Lens

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape configuration for EDI Lens services
  - job_name: "edi-lens-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Services with built-in metrics endpoints
  - job_name: "edi-lens-keycloak"
    static_configs:
      - targets: ["keycloak:8080"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "edi-lens-minio"
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: "/minio/v2/metrics/cluster"
    scrape_interval: 30s

  # Docker and infrastructure metrics
  - job_name: "docker-stats"
    static_configs:
      - targets: ["caddy:2019"]  # Caddy admin API with metrics
    scrape_interval: 30s
    metrics_path: "/metrics"

  # Note: Services without metrics endpoints (commented out for now):
  # - Frontend (React app - would need custom metrics)
  # - PostgreSQL (would need postgres_exporter)
  # - SFTPGo (check if it has metrics endpoint)
  # - NiFi/NiFi Registry (have JMX metrics, would need jmx_exporter)

  # Monitoring services that do expose metrics
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
    scrape_interval: 30s

  - job_name: "prometheus-monitor"
    static_configs:
      - targets: ["prometheus:9090"]
    scrape_interval: 30s

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    scrape_interval: 30s