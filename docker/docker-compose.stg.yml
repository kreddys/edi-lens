# FILE: docker/docker-compose.stg.yml
# STAGING OVERRIDE: Uses production images but dev Caddy for local access.

services:
  caddy-test:
    # Just expose the standard ports for local access.
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"

  backend-test:
    image: ${DOCKERHUB_USERNAME}/edi-lens-backend:${BACKEND_IMAGE_TAG:-latest}
    build: null # Disable building
    volumes:
      # Unset local code mount, but keep schema mount
      - ./backend/data/edi_schemas:/home/appuser/app/data/edi_schemas
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  admin-ui-test:
    image: ${DOCKERHUB_USERNAME}/edi-lens-ui:${UI_IMAGE_TAG:-latest}
    build: null # Disable building
    volumes: [] # Unset all volumes

  # Disable all dev-only services not needed for staging
  lightrag-server-test:
    profiles: [ "donotstart" ]
  openlit-db-test:
    profiles: [ "donotstart" ]
  openlit-otel-collector-test:
    profiles: [ "donotstart" ]
  openlit-ui-test:
    profiles: [ "donotstart" ]