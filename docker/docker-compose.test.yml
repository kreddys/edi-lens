# FILE: docker/docker-compose.test.yml
# Defines a COMPLETE, ISOLATED, and PARALLEL stack for the test environment.

services:
  caddy-test:
    image: caddy:2-alpine
    container_name: caddy-test
    ports:
      - "3001:3001"
      - "8081:8081"
      - "3301:3301"
      - "3401:3401"
    volumes:
      - ./docker/caddy/test.Caddyfile:/etc/caddy/Caddyfile
    networks:
      - edi_test_network
    depends_on:
      - backend-test
      - admin-ui-test
      - keycloak-test
      - lightrag-server-test
      - openlit-ui-test

  db-keycloak-test:
    image: postgres:15-alpine
    container_name: db-keycloak-test
    environment:
      POSTGRES_USER: ${POSTGRES_KC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KC_PASSWORD}
      POSTGRES_DB: ${POSTGRES_KC_DB}
    volumes:
      - postgres_kc_data_test:/var/lib/postgresql/data/
    networks:
      - edi_test_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_KC_PASSWORD} psql -h localhost -U ${POSTGRES_KC_USER} -d ${POSTGRES_KC_DB} -c 'SELECT 1' > /dev/null 2>&1"]

  db-app-test:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: db-app-test
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"      
    volumes:
      - postgres_app_data_test:/var/lib/postgresql/data/
      - ./docker/postgres/init-db-extensions.sh:/docker-entrypoint-initdb.d/init-extensions.sh
    networks:
      - edi_test_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c \"SELECT 1 FROM pg_extension WHERE extname = 'vector'\" > /dev/null 2>&1"]

  keycloak-test:
    image: bitnami/keycloak:latest
    container_name: keycloak-test
    depends_on:
      db-keycloak-test:
        condition: service_healthy
    environment:
      - KEYCLOAK_DATABASE_HOST=${POSTGRES_KC_HOST}
      - KEYCLOAK_DATABASE_NAME=${POSTGRES_KC_DB}
      - KEYCLOAK_DATABASE_USER=${POSTGRES_KC_USER}
      - KEYCLOAK_DATABASE_PASSWORD=${POSTGRES_KC_PASSWORD}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_DATABASE_VENDOR=postgresql
      - KEYCLOAK_PROXY_HEADERS=xforwarded
    networks:
      - edi_test_network

  lightrag-server-test:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag-server-test
    #Enable if LightRAG is configured to use a database
    #depends_on:
    #  db-app-test:
    #    condition: service_healthy
    volumes:
      - ./data/lightrag-data-test:/app/data/rag_storage  
    env_file:
      - .env.test
    command: >
      --host 0.0.0.0 --port 9621 --workspace ${LIGHTRAG_WORKSPACE} --auto-scan-at-startup
    networks:
      - edi_test_network

  backend-test:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: test
    container_name: backend-test
    depends_on:
      db-app-test:
        condition: service_healthy
      keycloak-test:
        condition: service_started
      lightrag-server-test:
        condition: service_started
      openlit-otel-collector-test:
        condition: service_started
    volumes:
      - ./backend:/home/appuser/app:delegated
      - /home/appuser/app/.venv
    networks:
      - edi_test_network
    env_file:
      - .env.test
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src --reload-dir alembic

  admin-ui-test:
    build:
      context: .
      dockerfile: docker/admin-ui/Dockerfile.dev
    container_name: admin-ui-test
    volumes:
      - ./admin-ui:/app:delegated
      - admin-ui-node-modules-test:/app/node_modules
    env_file:
      - .env.test
    depends_on:
      - backend-test
    networks:
      - edi_test_network
    command: npm run dev -- --host 0.0.0.0 --port 3000

  openlit-db-test:
    image: clickhouse/clickhouse-server:24.4.1
    container_name: openlit-db-test
    environment:
      CLICKHOUSE_USER: ${OPENLIT_DB_USER}
      CLICKHOUSE_PASSWORD: ${OPENLIT_DB_PASSWORD}
      CLICKHOUSE_DB: ${OPENLIT_DB_NAME}
    volumes:
      - openlit-db-data-test:/var/lib/clickhouse
    networks:
      - edi_test_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]

  openlit-otel-collector-test:
    image: otel/opentelemetry-collector-contrib:0.94.0
    container_name: openlit-otel-collector-test
    depends_on:
      openlit-db-test:
        condition: service_healthy
    environment:
      - INIT_DB_HOST=openlit-db-test
      - INIT_DB_PORT=9000
      - INIT_DB_DATABASE=${OPENLIT_DB_NAME}
      - INIT_DB_USERNAME=${OPENLIT_DB_USER}
      - INIT_DB_PASSWORD=${OPENLIT_DB_PASSWORD}
    volumes:
      - ./docker/openlit/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - edi_test_network

  openlit-ui-test:
    image: ghcr.io/openlit/openlit:latest
    container_name: openlit-ui-test
    depends_on:
      - openlit-otel-collector-test
    environment:
      - INIT_DB_HOST=openlit-db-test
      - INIT_DB_PORT=8123
      - INIT_DB_DATABASE=${OPENLIT_DB_NAME}
      - INIT_DB_USERNAME=${OPENLIT_DB_USER}
      - INIT_DB_PASSWORD=${OPENLIT_DB_PASSWORD}
      - SQLITE_DATABASE_URL=file:/app/client/data/data.db
    volumes:
      - openlit-data-test:/app/client/data
    networks:
      - edi_test_network

volumes:
  postgres_kc_data_test: {}
  postgres_app_data_test: {}
  admin-ui-node-modules-test: {}
  openlit-db-data-test: {}
  openlit-data-test: {}

networks:
  edi_test_network:
    name: edilens_test_network
    driver: bridge