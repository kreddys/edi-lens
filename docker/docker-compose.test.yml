# FILE: docker/docker-compose.test.yml
# This file defines the isolated services needed ONLY for running tests.
# It is layered on top of the base compose file during a test run.

services:
  # --- Test Database for Main App & RAG ---
  db-app-test:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: db-app-test
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./docker/postgres/init-db-extensions.sh:/docker-entrypoint-initdb.d/init-extensions.sh
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c \"SELECT 1 FROM pg_extension WHERE extname = 'vector'\" > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Test Database for Keycloak ---
  db-keycloak-test:
    image: postgres:15-alpine
    container_name: db-keycloak-test
    environment:
      POSTGRES_USER: ${POSTGRES_KC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KC_PASSWORD}
      POSTGRES_DB: ${POSTGRES_KC_DB}
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_KC_PASSWORD} psql -h localhost -U ${POSTGRES_KC_USER} -d ${POSTGRES_KC_DB} -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Test Keycloak Instance ---
  keycloak-test:
    image: bitnami/keycloak:latest
    container_name: keycloak-test
    depends_on:
      db-keycloak-test:
        condition: service_healthy
    environment:
      - KEYCLOAK_DATABASE_HOST=${POSTGRES_KC_HOST}
      - KEYCLOAK_DATABASE_NAME=${POSTGRES_KC_DB}
      - KEYCLOAK_DATABASE_USER=${POSTGRES_KC_USER}
      - KEYCLOAK_DATABASE_PASSWORD=${POSTGRES_KC_PASSWORD}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_DATABASE_VENDOR=postgresql
      - KEYCLOAK_PROXY_HEADERS=xforwarded
    ports:
      - "8081:8080" # Expose on a different host port for debugging
    networks:
      - edi_network

  # --- Test LightRAG Server ---
  lightrag-server-test:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag-server-test
    depends_on:
      db-app-test:
        condition: service_healthy
    env_file:
      - .env.test
    command: >
      --host 0.0.0.0
      --port 9621
      --workspace ${LIGHTRAG_WORKSPACE}
      --auto-scan-at-startup
    networks:
      - edi_network

  # --- Dedicated Backend Service for Running Tests ---
  backend-test-runner:
    # Uses the SAME image as the dev backend, ensuring consistency.
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: backend-test-runner
    depends_on:
      db-app-test:
        condition: service_healthy
      keycloak-test:
        condition: service_started
      lightrag-server-test:
        condition: service_started
    networks:
      - edi_network
    env_file:
      - .env.test
    # This command keeps the container alive so we can `exec` into it multiple times.
    command: tail -f /dev/null