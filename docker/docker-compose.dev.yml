# FILE: docker/docker-compose.dev.yml
# Defines the complete DEV environment stack. Hot-reloading is the default.

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports: ["3000:3000", "8080:8080", "3300:3300", "3400:3400"]
    volumes: ["./docker/caddy/dev.Caddyfile:/etc/caddy/Caddyfile"]
    networks: [edi_network]
    depends_on: [backend, admin-ui, keycloak, lightrag-server, openlit-ui]

  db-keycloak:
    image: postgres:15-alpine
    container_name: db-keycloak
    environment:
      POSTGRES_USER: ${POSTGRES_KC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KC_PASSWORD}
      POSTGRES_DB: ${POSTGRES_KC_DB}
    volumes:
      - postgres_kc_data:/var/lib/postgresql/data/
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_KC_PASSWORD} psql -h localhost -U ${POSTGRES_KC_USER} -d ${POSTGRES_KC_DB} -c 'SELECT 1' > /dev/null 2>&1"]

  db-app:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: db-app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_app_data:/var/lib/postgresql/data/
      - ./docker/postgres/init-db-extensions.sh:/docker-entrypoint-initdb.d/init-extensions.sh
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c \"SELECT 1 FROM pg_extension WHERE extname = 'vector'\" > /dev/null 2>&1"]

  keycloak:
    image: bitnami/keycloak:latest
    container_name: keycloak
    depends_on:
      db-keycloak:
        condition: service_healthy
    environment:
      - KEYCLOAK_DATABASE_HOST=${POSTGRES_KC_HOST}
      - KEYCLOAK_DATABASE_NAME=${POSTGRES_KC_DB}
      - KEYCLOAK_DATABASE_USER=${POSTGRES_KC_USER}
      - KEYCLOAK_DATABASE_PASSWORD=${POSTGRES_KC_PASSWORD}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_DATABASE_VENDOR=postgresql
      - KEYCLOAK_PROXY_HEADERS=xforwarded
    networks:
      - edi_network

  lightrag-server:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag-server
    volumes:
      - ./backend/data/knowledge:/app/inputs
    networks:
      - edi_network
    env_file:
      - .env.dev
    command: >
      --host 0.0.0.0 --port 9621 --workspace edi_lens_kb --auto-scan-at-startup
    depends_on:
      db-app:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: backend
    depends_on:
      db-app:
        condition: service_healthy
      keycloak:
        condition: service_started
      lightrag-server:
        condition: service_started
      openlit-otel-collector:
        condition: service_started
    volumes:
      - ./backend:/home/appuser/app:delegated
      - /home/appuser/app/.venv
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
    env_file:
      - .env.dev
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src --reload-dir alembic

  admin-ui:
    build:
      context: .
      dockerfile: docker/admin-ui/Dockerfile.dev
    container_name: admin-ui
    volumes:
      - ./admin-ui:/app:delegated
      - admin-ui-node-modules:/app/node_modules
    env_file:
      - .env.dev
    depends_on:
      - backend
    networks:
      - edi_network
    command: npm run dev -- --host 0.0.0.0 --port 3000

  openlit-db:
    image: clickhouse/clickhouse-server:24.4.1
    container_name: openlit-db
    environment:
      CLICKHOUSE_USER: ${OPENLIT_DB_USER}
      CLICKHOUSE_PASSWORD: ${OPENLIT_DB_PASSWORD}
      CLICKHOUSE_DB: ${OPENLIT_DB_NAME}
    volumes:
      - openlit-db-data:/var/lib/clickhouse
    networks:
      - edi_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]

  openlit-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.94.0
    container_name: openlit-otel-collector
    depends_on:
      openlit-db:
        condition: service_healthy
    environment:
      - INIT_DB_HOST=openlit-db
      - INIT_DB_PORT=9000
      - INIT_DB_DATABASE=${OPENLIT_DB_NAME}
      - INIT_DB_USERNAME=${OPENLIT_DB_USER}
      - INIT_DB_PASSWORD=${OPENLIT_DB_PASSWORD}
    volumes:
      - ./docker/openlit/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - edi_network

  openlit-ui:
    image: ghcr.io/openlit/openlit:latest
    container_name: openlit-ui
    depends_on:
      - openlit-otel-collector
    environment:
      - INIT_DB_HOST=openlit-db
      - INIT_DB_PORT=8123
      - INIT_DB_DATABASE=${OPENLIT_DB_NAME}
      - INIT_DB_USERNAME=${OPENLIT_DB_USER}
      - INIT_DB_PASSWORD=${OPENLIT_DB_PASSWORD}
      - SQLITE_DATABASE_URL=file:/app/client/data/data.db
    volumes:
      - openlit-data:/app/client/data
    networks:
      - edi_network

volumes:
  postgres_kc_data: {}
  postgres_app_data: {}
  admin-ui-node-modules: {}
  openlit-db-data: {}
  openlit-data: {}

networks:
  edi_network:
    name: edilens_dev_network
    driver: bridge