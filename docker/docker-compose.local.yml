# Docker Compose override for local testing
# This file reconfigures the backend to use localhost URLs when testing locally
# Usage: docker-compose -f docker-compose.yml -f docker-compose.local.yml up

services:
  backend:
    env_file:
      - ../.env.local  # Override with local environment
    extra_hosts:
      - "localhost:host-gateway"  # Map localhost to host machine
    environment:
      # These override the env_file values to ensure localhost connectivity
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/edi_lens
      NIFI_URL: https://localhost:8443
      NIFI_REGISTRY_URL: http://localhost:18080