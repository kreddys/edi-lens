# FILE: docker-compose.yml
# This compose file defines the local development environment with Caddy as the single entry point.

services:
  # --- CADDY REVERSE PROXY ---
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "3000:3000" # Main app entry point (UI & API)
      - "8080:8080" # Keycloak admin UI
      - "3300:3300" # OpenLit UI
      - "3400:3400" # LightRAG UI
    volumes:
      - ./docker/caddy/dev.Caddyfile:/etc/caddy/Caddyfile
    networks:
      - edi_network
    depends_on:
      - backend
      - admin-ui
      - keycloak
      - openlit-ui
      - lightrag-server


  # --- DB #1: For Keycloak (Standard PostgreSQL) ---
  db-keycloak:
    image: postgres:15-alpine
    container_name: db-keycloak
    environment:
      POSTGRES_USER: ${POSTGRES_KC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KC_PASSWORD}
      POSTGRES_DB: ${POSTGRES_KC_DB}
    volumes:
      - postgres_kc_data:/var/lib/postgresql/data/
    # No ports exposed directly to host
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_KC_PASSWORD} psql -h localhost -U ${POSTGRES_KC_USER} -d ${POSTGRES_KC_DB} -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- DB #2: For Main App & LightRAG (Custom Image with Extensions) ---
  db-app:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: db-app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_app_data:/var/lib/postgresql/data/
      - ./docker/postgres/init-db-extensions.sh:/docker-entrypoint-initdb.d/init-extensions.sh
    # No ports exposed directly to host
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c \"SELECT 1 FROM pg_extension WHERE extname = 'vector'\" > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: bitnami/keycloak:latest
    container_name: keycloak
    depends_on:
      db-keycloak:
        condition: service_healthy
    environment:
      - KEYCLOAK_DATABASE_HOST=${KEYCLOAK_DATABASE_HOST}
      - KEYCLOAK_DATABASE_PORT=${KEYCLOAK_DATABASE_PORT}
      - KEYCLOAK_DATABASE_NAME=${KEYCLOAK_DATABASE_NAME}
      - KEYCLOAK_DATABASE_USER=${KEYCLOAK_DATABASE_USER}
      - KEYCLOAK_DATABASE_PASSWORD=${KEYCLOAK_DATABASE_PASSWORD}
      - KEYCLOAK_DATABASE_SCHEMA=${KEYCLOAK_DATABASE_SCHEMA}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_DATABASE_VENDOR=postgresql
      - KEYCLOAK_PROXY_HEADERS=xforwarded
    networks:
      - edi_network

  lightrag-server:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag-server
    restart: always
    # No ports exposed directly to host
    volumes:
      - ./backend/data/knowledge:/app/inputs
    networks:
      - edi_network
    env_file:
      - .env.dev
    command: >
      --host 0.0.0.0
      --port 9621
      --workspace edi_lens_kb
      --auto-scan-at-startup
    depends_on:
      db-app:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: backend
    depends_on:
      db-app:
        condition: service_healthy
      keycloak:
        condition: service_started
      lightrag-server:
        condition: service_started
    # No ports exposed directly to host
    volumes:
      - ./backend:/home/appuser/app:delegated
      - /home/appuser/app/.venv
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src --reload-dir alembic
    env_file:
      - .env.dev

  admin-ui:
    build:
      context: .
      dockerfile: docker/admin-ui/Dockerfile.dev
    container_name: admin-ui
    volumes:
      - ./admin-ui:/app:delegated
      - admin-ui-node-modules:/app/node_modules
    # No ports exposed directly to host
    command: npm run dev -- --host 0.0.0.0 --port 3000 # Explicitly set Vite's internal port
    env_file:
      - .env.dev
    depends_on:
      - backend
    networks:
      - edi_network

networks:
  edi_network:
    name: edi-lens_edi_network
    driver: bridge

volumes:
  postgres_kc_data:
  postgres_app_data:
  admin-ui-node-modules: