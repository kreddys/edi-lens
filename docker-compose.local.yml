# FILE: docker-compose.dev.yml
services:
  backend:
    # --- FIX: Remove 'poetry run'. The entrypoint now handles the PATH. ---
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env.local
    user: "${UID:-1000}:${GID:-1000}"

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile.dev
    volumes:
      - ./admin-ui:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    command: npm run dev -- --host
    env_file: .env.local