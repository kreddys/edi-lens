# FILE: docker-compose.prod.yml
services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    networks:
      - edi_network
    depends_on:
      - backend
      - keycloak

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - KEYCLOAK_DB_SCHEMA=${KEYCLOAK_DB_SCHEMA}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./backend/scripts/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c \"SELECT 1 FROM pg_namespace WHERE nspname = '$${KEYCLOAK_DB_SCHEMA}';\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - KC_HOSTNAME_URL=https://auth.${REMOTE_HOST}
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY=edge
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL_HOST=db
      - KC_DB_URL_DATABASE=${POSTGRES_DB}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KC_DB_SCHEMA=${KEYCLOAK_DB_SCHEMA}
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    ports: # Expose management port for healthcheck from host if needed, but not required if check is internal
      - "9000:9000"
    networks:
      - edi_network
    command: start-dev
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost:9000\\r\\nConnection: close\\r\\n\\r\\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1"]
      interval: 5s       # Check every 5 seconds
      timeout: 5s        # Give each check 5 seconds to respond
      retries: 30        # Allow up to 30 failures (30 * 5s = 150s of checks)
      start_period: 15s  # Grace period of 30s before checks start failing

  backend:
    image: ${DOCKERHUB_USERNAME}/edi-lens-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - ./backend/data/edi_schemas:/home/appuser/app/data/edi_schemas
    environment:
      - KEYCLOAK_URL=https://auth.${REMOTE_HOST}      
    env_file: .env
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  admin-ui:
    image: ${DOCKERHUB_USERNAME}/edi-lens-ui:${UI_IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - backend
    networks:
      - edi_network

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  edi_network:
    name: edi-lens_edi_network
    driver: bridge