# FILE: docker-compose.prod.yml
services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    networks:
      - edi_network
    depends_on:
      - backend
      - keycloak

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - KEYCLOAK_DB_SCHEMA=${KEYCLOAK_DB_SCHEMA}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./backend/scripts/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c \"SELECT 1 FROM pg_namespace WHERE nspname = '$${KEYCLOAK_DB_SCHEMA}';\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: bitnami/keycloak:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- FIX 1: Use the official Bitnami environment variables ---
      - KEYCLOAK_DATABASE_VENDOR=postgresql # Explicitly set vendor
      - KEYCLOAK_DATABASE_HOST=db          # Connect to the 'db' service
      - KEYCLOAK_DATABASE_NAME=${POSTGRES_DB}
      - KEYCLOAK_DATABASE_USER=${POSTGRES_USER}
      - KEYCLOAK_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - KEYCLOAK_DATABASE_SCHEMA=${KEYCLOAK_DB_SCHEMA}

      # Proxy settings for Bitnami image
      - KEYCLOAK_PROXY_HEADERS=xforwarded
      - KEYCLOAK_HOSTNAME_URL=https://auth.${REMOTE_HOST}
      
      # Admin user creation
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      # --- FIX 2: Re-expose port 9000 for the healthcheck ---
      - "9000:9000"
    networks:
      - edi_network
    healthcheck:
      # --- FIX 3: Use your previously working healthcheck command ---
      # Note: The Bitnami image may not expose a management port by default, but this is worth trying first.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost:9000\\r\\nConnection: close\\r\\n\\r\\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    image: ${DOCKERHUB_USERNAME}/edi-lens-backend:${BACKEND_IMAGE_TAG:-latest-dev}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - ./backend/data/edi_schemas:/home/appuser/app/data/edi_schemas
    # Explicitly set the internal URL for Keycloak communication
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
    env_file: .env
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  admin-ui:
    image: ${DOCKERHUB_USERNAME}/edi-lens-ui:${UI_IMAGE_TAG:-latest-dev}
    restart: always
    depends_on:
      - backend
    networks:
      - edi_network

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  edi_network:
    name: edi-lens_edi_network
    driver: bridge