# FILE: docker-compose.prod.yml
services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    networks:
      - edi_network
    depends_on:
      - backend
      - keycloak

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - KEYCLOAK_DB_SCHEMA=${KEYCLOAK_DB_SCHEMA}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./backend/scripts/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c \"SELECT 1 FROM pg_namespace WHERE nspname = '$${KEYCLOAK_DB_SCHEMA}';\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: bitnami/keycloak:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Bitnami-specific database variables
      - KEYCLOAK_DATABASE_VENDOR=postgresql
      - KEYCLOAK_DATABASE_HOST=db
      - KEYCLOAK_DATABASE_NAME=${POSTGRES_DB}
      - KEYCLOAK_DATABASE_USER=${POSTGRES_USER}
      - KEYCLOAK_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - KEYCLOAK_DATABASE_SCHEMA=${KEYCLOAK_DB_SCHEMA}

      # Proxy settings for Bitnami image
      - KEYCLOAK_PROXY_HEADERS=xforwarded
      - KEYCLOAK_HOSTNAME_URL=https://auth.${REMOTE_HOST}
      
      # Admin user creation
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      
      # --- THIS IS THE FIX: Enable health endpoints for the healthcheck ---
      - KEYCLOAK_ENABLE_HEALTH_ENDPOINTS=true
    networks:
      - edi_network
    healthcheck:
      # --- THIS IS THE FIX: Use the correct healthcheck for the Bitnami image ---
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    image: ${DOCKERHUB_USERNAME}/edi-lens-backend:${BACKEND_IMAGE_TAG:-latest-dev}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - ./backend/data/edi_schemas:/home/appuser/app/data/edi_schemas
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
    env_file: .env
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  admin-ui:
    image: ${DOCKERHUB_USERNAME}/edi-lens-ui:${UI_IMAGE_TAG:-latest-dev}
    restart: always
    depends_on:
      - backend
    networks:
      - edi_network

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  edi_network:
    name: edi-lens_edi_network
    driver: bridge