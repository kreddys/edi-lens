# FILE: docker-compose.prod.yml
# This file is used for production-like deployments, pulling pre-built images.

services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - KEYCLOAK_DB_SCHEMA=${KEYCLOAK_DB_SCHEMA}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data/
      - ./backend/scripts/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  backend:
    image: ${DOCKERHUB_USERNAME}/edi-lens-backend:${BACKEND_IMAGE_TAG:-latest}
    depends_on:
      - db
      - keycloak
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data/edi_schemas:/var/edi_lens/schemas
    env_file: .env
    networks:
      - edi_network
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    depends_on:
      - db
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL_HOST=db
      - KC_DB_URL_PORT=5432
      - KC_DB_URL_DATABASE=${POSTGRES_DB}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KC_DB_SCHEMA=${KEYCLOAK_DB_SCHEMA}
    ports:
      - "8080:8080"
    networks:
      - edi_network
    command: start --auto-build
    restart: always

  admin-ui:
    image: ${DOCKERHUB_USERNAME}/edi-lens-ui:${UI_IMAGE_TAG:-latest}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - edi_network
    restart: always

networks:
  edi_network:
    driver: bridge