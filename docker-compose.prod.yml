# FILE: docker-compose.prod.yml
services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    networks:
      - edi_network
    depends_on:
      - backend
      - keycloak

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - KEYCLOAK_DB_SCHEMA=${KEYCLOAK_DB_SCHEMA}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./backend/scripts/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c \"SELECT 1 FROM pg_namespace WHERE nspname = '$${KEYCLOAK_DB_SCHEMA}';\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    # --- FIX 1: Use the Bitnami image which supports ARM64 architecture ---
    image: bitnami/keycloak:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- FIX 2: Use Bitnami-compatible environment variables for proxying ---
      # This combination correctly configures Keycloak to run behind Caddy.
      - KEYCLOAK_PROXY_HEADERS=xforwarded
      - KEYCLOAK_HOSTNAME_URL=https://auth.${REMOTE_HOST}
      - KEYCLOAK_HTTP_HOST=0.0.0.0
      
      # Bitnami variables for initial admin user
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}

      # Standard Keycloak DB variables (work with Bitnami image)
      - KC_DB=postgres
      - KC_DB_URL_HOST=db
      - KC_DB_URL_DATABASE=${POSTGRES_DB}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KC_DB_SCHEMA=${KEYCLOAK_DB_SCHEMA}
    networks:
      - edi_network
    healthcheck:
      # --- FIX 3: Update healthcheck for the Bitnami image ---
      # It uses the standard /health path on port 8080.
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    # --- FIX 4: Use the correct image tag for the dev branch ---
    image: ${DOCKERHUB_USERNAME}/edi-lens-backend:${BACKEND_IMAGE_TAG:-latest-dev}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - ./backend/data/edi_schemas:/home/appuser/app/data/edi_schemas
    # Explicitly set the internal URL for Keycloak communication
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
    env_file: .env
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  admin-ui:
    # --- FIX 5: Use the correct image tag for the dev branch ---
    image: ${DOCKERHUB_USERNAME}/edi-lens-ui:${UI_IMAGE_TAG:-latest-dev}
    restart: always
    depends_on:
      - backend
    networks:
      - edi_network

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  edi_network:
    name: edi-lens_edi_network
    driver: bridge