# EDI Validation Flow Configuration
# This YAML file defines the complete EDI validation workflow for NiFi

flow:
  name: "EDI Validation Test Flow"
  description: "Complete EDI validation workflow with proper positioning and relationships"
  
  # Flow layout configuration - Spacious and professional
  layout:
    start_x: 150
    start_y: 150
    spacing_x: 500
    spacing_y: 200

  # Processor definitions with improved spacing and positioning
  processors:
    - id: "getfile"
      name: "📁 GetFile - EDI Input"
      type: "org.apache.nifi.processors.standard.GetFile"
      position:
        x: 150
        y: 300
      properties:
        "Input Directory": "/tmp/nifi-test-data"
        "File Filter": ".*\\.edi"
        "Keep Source File": "false"
        "Polling Interval": "10 sec"
        "Batch Size": "1"
      auto_terminated_relationships:
        - "failure"
      
    - id: "edi_validation"
      name: "🔍 EDI Validation Processor"
      type: "EDIValidationProcessor"
      position:
        x: 650
        y: 300
      properties:
        "Validation Schema": "837.5010.X222.A1.json"
        "SNIP Level": "3"
        "Tenant ID": "tenant-a"
        "Schema Base Path": "/opt/nifi/nifi-current/python_extensions/edi-processors/schemas"
        "Cache Schemas": "true"
      auto_terminated_relationships:
        - "original"
        
    - id: "log_success"
      name: "📝 Log Validation Success"
      type: "org.apache.nifi.processors.standard.LogMessage"
      position:
        x: 1150
        y: 150
      properties: {}
      auto_terminated_relationships:
        - "success"
        
    - id: "log_failure"
      name: "📝 Log Validation Failure"
      type: "org.apache.nifi.processors.standard.LogMessage"
      position:
        x: 1150
        y: 450
      properties: {}
      auto_terminated_relationships:
        - "success"
        
    - id: "put_success"
      name: "💾 Output Valid Results"
      type: "org.apache.nifi.processors.standard.PutFile"
      position:
        x: 1650
        y: 150
      properties:
        "Directory": "/tmp/nifi-test-data/success"
        "Conflict Resolution Strategy": "replace"
      auto_terminated_relationships:
        - "success"
        - "failure"
        
    - id: "put_failure"
      name: "💾 Output Failed Results"
      type: "org.apache.nifi.processors.standard.PutFile"
      position:
        x: 1650
        y: 450
      properties:
        "Directory": "/tmp/nifi-test-data/failure"
        "Conflict Resolution Strategy": "replace"
      auto_terminated_relationships:
        - "success"
        - "failure"

  # Connection definitions
  connections:
    - id: "getfile_to_validation"
      source: "getfile"
      destination: "edi_validation"
      relationships:
        - "success"
        
    - id: "validation_to_log_success"
      source: "edi_validation"
      destination: "log_success"
      relationships:
        - "success"
        
    - id: "validation_to_log_failure"
      source: "edi_validation"
      destination: "log_failure"
      relationships:
        - "failure"
        
    - id: "log_success_to_put_success"
      source: "log_success"
      destination: "put_success"
      relationships:
        - "success"
        
    - id: "log_failure_to_put_failure"
      source: "log_failure"
      destination: "put_failure"
      relationships:
        - "success"

  # Optional: Processor groups for organization
  processor_groups: []

  # Flow-level settings
  settings:
    auto_start: false  # Don't auto-start processors after creation
    validate_connections: true
    cleanup_on_error: true