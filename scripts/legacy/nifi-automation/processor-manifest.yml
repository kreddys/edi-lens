# NiFi EDI Processors Extension Manifest
# Defines the EDI processing processors for Apache NiFi

extension:
  name: "EDI Processors"
  version: "1.0.0"
  description: "Production-ready EDI processing processors for Apache NiFi"
  
processors:
  - class: "processors.edi_validation_processor.EDIValidationProcessor"
    name: "EDI Validation Processor"
    description: "Validates EDI documents against implementation guide schemas"
    tags: ["edi", "validation", "x12", "healthcare"]
    
  - class: "processors.ta1_generation_processor.TA1GenerationProcessor" 
    name: "TA1 Generation Processor"
    description: "Generates TA1 acknowledgments based on validation results"
    tags: ["edi", "ta1", "acknowledgment", "x12"]
    
  - class: "processors.edi_parsing_processor.EDIParsingProcessor"
    name: "EDI Parsing Processor" 
    description: "Parses EDI into structured formats (JSON/XML/CSV)"
    tags: ["edi", "parsing", "x12", "json", "xml", "csv"]

dependencies:
  python:
    - "pydantic>=2.0.0"
    - "typing-extensions>=4.0.0"

capabilities:
  - "Multi-format output (JSON, XML, CSV)"
  - "Multi-tenant schema support" 
  - "High-performance processing (30,000+ segments/second)"
  - "Native FlowFile processing"
  - "Comprehensive error handling"
  - "Expression language support"

compatibility:
  nifi_version: ">=1.23.0"
  python_version: ">=3.9"