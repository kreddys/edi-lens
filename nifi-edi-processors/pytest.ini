[pytest]
# Look for tests in the 'tests' directory
testpaths = tests

# Tell pytest about our source folder for better imports
pythonpath = .

# Register custom markers to avoid warnings
markers =
    unit: Pure unit tests with no external dependencies.
    integration: Tests requiring external services or complex setups.
    format: Tests for specific output format validation.

# addopts provides command-line options to apply to every run.
# --tb=short will produce a much shorter, more readable traceback.
addopts = --tb=short -v

# Force pytest to stream logs directly to the console during the run.
log_cli = true
# Set a default log level for the console output.
log_cli_level = INFO

# filterwarnings ignores specified warnings so they don't clutter the output.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning