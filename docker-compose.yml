# FILE: docker-compose.yml
# BASE configuration for LOCAL DEVELOPMENT and AUTOMATED TESTING.
# Defines the complete stack with clean service names. Isolation is handled by the run.sh script.

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports: ["3001:3001", "8081:8081"]
    volumes:
      - ./docker/caddy/dev.Caddyfile:/etc/caddy/Caddyfile
    networks:
      - edi_lens_network
    depends_on: [backend, admin-ui, keycloak]

  db-keycloak:
    image: postgres:15-alpine
    container_name: db-keycloak
    environment:
      POSTGRES_USER: ${POSTGRES_KC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KC_PASSWORD}
      POSTGRES_DB: ${POSTGRES_KC_DB}
    volumes:
      - postgres_kc_data:/var/lib/postgresql/data/
    networks:
      - edi_lens_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_KC_PASSWORD} psql -h localhost -U ${POSTGRES_KC_USER} -d ${POSTGRES_KC_DB} -c 'SELECT 1' > /dev/null 2>&1"]

  db-app:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: db-app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_app_data:/var/lib/postgresql/data/
      - ./docker/postgres/init-db-extensions.sh:/docker-entrypoint-initdb.d/init-extensions.sh
    networks:
      - edi_lens_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c \"SELECT 1 FROM pg_extension WHERE extname = 'vector'\" > /dev/null 2>&1"]

  keycloak:
    image: bitnami/keycloak:latest
    container_name: keycloak
    depends_on: { db-keycloak: { condition: service_healthy } }
    environment:
      - KEYCLOAK_DATABASE_HOST=db-keycloak
      - KEYCLOAK_DATABASE_NAME=${POSTGRES_KC_DB}
      - KEYCLOAK_DATABASE_USER=${POSTGRES_KC_USER}
      - KEYCLOAK_DATABASE_PASSWORD=${POSTGRES_KC_PASSWORD}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_DATABASE_VENDOR=postgresql
      - KEYCLOAK_PROXY_HEADERS=xforwarded
    networks:
      - edi_lens_network

  backend:
    build: { context: ., dockerfile: docker/backend/Dockerfile, target: test }
    container_name: backend
    depends_on: { db-app: { condition: service_healthy }, keycloak: { condition: service_started } }
    volumes: ['./backend:/home/appuser/app:delegated', '/home/appuser/app/.venv']
    networks: [ edi_lens_network ]
    env_file: [ .env.dev ]
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src --reload-dir alembic

  admin-ui:
    build: { context: ., dockerfile: docker/admin-ui/Dockerfile.dev }
    container_name: admin-ui
    volumes: ['./admin-ui:/app:delegated', 'admin-ui-node-modules:/app/node_modules']
    env_file: [ .env.dev ]
    depends_on: [ backend ]
    networks: [ edi_lens_network ]
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  postgres_kc_data: {}
  postgres_app_data: {}
  admin-ui-node-modules: {}

networks:
  edi_lens_network:
    driver: bridge