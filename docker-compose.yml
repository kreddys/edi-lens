services:
  # The Python Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # The React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # The PostgreSQL Database for OUR Application
  db:
    image: postgres:15-alpine
    volumes:
      - ./postgres-data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  # <<< NEW KEYCLOAK SERVICE >>>
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    ports:
      - "8080:8080" # Keycloak UI/API port
    environment:
      KEYCLOAK_ADMIN: admin # Admin username for Keycloak UI
      KEYCLOAK_ADMIN_PASSWORD: admin # Admin password for Keycloak UI
    command: start-dev # Use development mode for easy setup