services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data/
      - ./backend/scripts/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
      - keycloak
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/home/appuser/app
      - ./backend/data/edi_schemas:/var/edi_lens/schemas
      - /home/appuser/app/.venv
    env_file:
      - .env
    networks:
      - edi_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    depends_on:
      - db
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000" # <-- Expose the management port
    networks:
      - edi_network
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
      args:
        - VITE_KEYCLOAK_URL=${KEYCLOAK_BROWSER_URL}
        - VITE_KEYCLOAK_REALM=${KEYCLOAK_REALM}
        - VITE_KEYCLOAK_CLIENT_ID=${KEYCLOAK_UI_CLIENT_ID}
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - edi_network
    env_file:
      - .env

networks:
  edi_network:
    driver: bridge