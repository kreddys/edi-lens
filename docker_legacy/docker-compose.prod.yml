# Production overrides for docker-compose.yml
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile  # Use production Dockerfile
    environment:
      # Production environment variables
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    volumes:
      # Remove volume mounts - use code baked into image
      - /dev/null:/app/src  # Override the dev volume mount
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 4 --no-access-log
    # Remove the hot reload volumes and use production command