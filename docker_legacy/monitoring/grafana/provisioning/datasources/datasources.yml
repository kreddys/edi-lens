# FILE: docker/monitoring/grafana/provisioning/datasources/datasources.yml
# Grafana datasource provisioning configuration

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    jsonData:
      httpMethod: GET
    version: 1
    editable: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    jsonData:
      httpMethod: GET
    version: 1
    editable: true