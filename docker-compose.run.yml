# FILE: docker-compose.run.yml

services:
  run-command:
    image: ${RUN_IMAGE}
    working_dir: /home/appuser/app 
    # --- THIS IS THE FIX ---
    # REMOVE THE VOLUMES SECTION COMPLETELY.
    # The image already contains the scripts and all dependencies.
    # Mounting the local directory was hiding the .venv inside the image.
    networks:
      - edi_network
    env_file:
      - .env
    command: ["echo", "Ready to run command..."] 