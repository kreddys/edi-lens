# FILE: docker-compose.run.yml
services:
  run-command:
    image: ${RUN_IMAGE}
    # Set the working directory to the backend code root inside the container
    working_dir: /app/backend
    volumes:
      # Mount the entire project to /app
      - .:/app
    networks:
      - edi_network
    # The command will be provided by the script
    command: ["echo", "Ready to run command..."]

networks:
  edi_network:
    # Use the existing network created by the main compose files
    external: true