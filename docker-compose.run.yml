# FILE: docker-compose.run.yml

services:
  run-command:
    image: ${RUN_IMAGE}
    working_dir: /home/appuser/app
    env_file:
      - .env
    # Tell this service to connect to the edi_network
    networks:
      - edi_network

# Define the network as external so Docker Compose knows not to create it.
# It will look for a network with the project-prefixed name.
networks:
  edi_network:
    external: true
    # The name must match the network created by the main compose file
    name: edi-lens_edi_network