# FILE: docker-compose.run.yml
services:
  run-command:
    image: ${RUN_IMAGE}
    working_dir: /app
    volumes:
      - .:/app
    networks:
      - edi_network
    # --- THIS IS THE FIX ---
    # Load the environment variables from the .env file in the project root.
    # This works for both docker-compose v1 and v2.
    env_file:
      - .env
    command: ["echo", "Ready to run command..."]

networks:
  edi_network:
    external: true
    name: edi-lens_edi_network