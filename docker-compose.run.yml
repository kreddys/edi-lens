# FILE: docker-compose.run.yml
services:
  run-command:
    image: ${RUN_IMAGE}
    # Mount the entire project so scripts and configs can be found
    volumes:
      - .:/app
    # Set the working directory to where code is mounted
    working_dir: /app
    # CRITICAL: This ensures it connects to the same network as our running services
    networks:
      - edi_network
    command: ["echo", "Ready to run command..."]

networks:
  edi_network:
    external:
      name: edi-lens_edi_network